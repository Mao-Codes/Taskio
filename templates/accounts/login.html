{% extends "base.html" %}
{% block title %}Log in · Taskio{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header">Welcome back</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_div }}
          <button class="btn btn-primary w-100 mt-3">Log in</button>
        </form>
        <p class="mt-3 mb-0 small">New here? <a href="{% url 'signup' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
