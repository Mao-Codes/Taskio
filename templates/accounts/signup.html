{% extends "base.html" %}
{% block title %}Sign up · Taskio{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header">Create your account</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_div }}
          <button class="btn btn-primary w-100 mt-3">Sign up</button>
        </form>
        <p class="mt-3 mb-0 small">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
