{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header">{{ heading }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_div }}
          <button class="btn btn-primary mt-3">Save</button>
          <a href="javascript:history.back()" class="btn btn-light mt-3">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
