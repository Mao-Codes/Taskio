{% extends "base.html" %}
{% block title %}Confirm delete · Taskio{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">Confirm delete</div>
      <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-cta">Yes, delete</button>
          <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
